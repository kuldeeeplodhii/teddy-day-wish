<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Tanvi ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

    :root {
      --bg-color: #ffe6e6;
      --bear-color: #d89f68;
      --bear-dark: #b8804c;
      --snout: #f5dcb8;
      --blush: #ffb7b2;
      --heart: #ff4d6d;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at center, #fff0f0, #ffcfcf);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* Container for the card */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(255, 100, 100, 0.2);
      text-align: center;
      max-width: 85%;
      width: 350px;
      z-index: 10;
      transition: all 0.5s ease;
      border: 2px solid white;
    }

    /* --- CSS ART: THE TEDDY BEAR --- */
    .bear-container {
      position: relative;
      width: 180px;
      height: 160px;
      margin: 0 auto 20px;
    }

    .bear-head {
      position: absolute;
      width: 140px;
      height: 120px;
      background-color: var(--bear-color);
      border-radius: 50% 50% 45% 45%;
      left: 20px;
      top: 20px;
      z-index: 2;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,0.05);
      animation: bob 3s ease-in-out infinite;
    }

    .ear {
      position: absolute;
      width: 45px;
      height: 45px;
      background-color: var(--bear-color);
      border-radius: 50%;
      top: 10px;
      z-index: 1;
    }

    .ear.left { left: 15px; }
    .ear.right { right: 15px; }

    .ear-inner {
      position: absolute;
      width: 25px;
      height: 25px;
      background-color: var(--bear-dark);
      border-radius: 50%;
      top: 10px;
      left: 10px;
    }

    .eye {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: #333;
      border-radius: 50%;
      top: 45px;
      animation: blink 4s infinite;
    }

    .eye.left { left: 35px; }
    .eye.right { right: 35px; }

    .snout {
      position: absolute;
      width: 50px;
      height: 35px;
      background-color: var(--snout);
      border-radius: 50%;
      top: 55px;
      left: 45px;
    }

    .nose {
      position: absolute;
      width: 18px;
      height: 12px;
      background-color: #4a3b2a;
      border-radius: 50%;
      top: 8px;
      left: 16px;
    }

    .mouth {
      position: absolute;
      width: 20px;
      height: 10px;
      border-bottom: 3px solid #4a3b2a;
      border-radius: 0 0 20px 20px;
      top: 15px;
      left: 15px;
    }

    .blush {
      position: absolute;
      width: 22px;
      height: 12px;
      background-color: var(--blush);
      border-radius: 50%;
      top: 65px;
      opacity: 0.6;
    }

    .blush.left { left: 20px; }
    .blush.right { right: 20px; }

    /* --- TEXT & BUTTONS --- */
    h1 {
      font-family: 'Fredoka One', cursive;
      color: #d65a5a;
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px white;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 25px;
      min-height: 50px;
      font-weight: 600;
    }

    .btn {
      background-color: var(--heart);
      color: white;
      border: none;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Message Styles */
    .hidden-message {
      display: none;
      font-size: 20px;
      color: #d65a5a;
      font-weight: bold;
      line-height: 1.6;
    }
    
    .signature {
      margin-top: 15px;
      font-size: 16px;
      color: #888;
      font-style: italic;
    }

    /* --- ANIMATIONS --- */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    /* Falling Hearts */
    .heart-rain {
      position: fixed;
      top: -10vh;
      color: var(--heart);
      z-index: 20; /* In front of card */
      animation: fall linear forwards;
      pointer-events: none; /* Let clicks pass through */
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="card">
    <div class="bear-container">
      <div class="ear left"><div class="ear-inner"></div></div>
      <div class="ear right"><div class="ear-inner"></div></div>
      <div class="bear-head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="snout">
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>

    <h1 id="main-title">Hey Tanvi! ❤️</h1>
    <p id="sub-text">I found this cute teddy, and it reminded me of how adorable you are...</p>
    
    <button class="btn" onclick="celebrate()">Tap for a Hug</button>
    
    <div class="hidden-message" id="final-msg">
      Happy Teddy Day, My Love! <br>
      You are the cutest and most huggable person in my world.
      <div class="signature">Forever yours,<br>Kuldeep</div>
    </div>
  </div>

  <script>
    function celebrate() {
      const btn = document.querySelector('.btn');
      const title = document.getElementById('main-title');
      const subText = document.getElementById('sub-text');
      const finalMsg = document.getElementById('final-msg');

      // 1. Hide Button and change title
      btn.style.display = 'none';
      subText.style.display = 'none';
      title.innerText = "I Love You!";
      
      // 2. Show Final Message with a fade in
      finalMsg.style.display = 'block';
      finalMsg.style.opacity = '0';
      let opacity = 0;
      const fadeIn = setInterval(() => {
        if (opacity >= 1) clearInterval(fadeIn);
        finalMsg.style.opacity = opacity;
        opacity += 0.05;
      }, 50);

      // 3. Trigger massive heart rain
      createHearts();
    }

    function createHearts() {
      const heartCount = 60; // Lots of hearts!
      for (let i = 0; i < heartCount; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.classList.add('heart-rain');
          heart.innerHTML = '&#10084;'; // Heart emoji
          
          // Random positioning and size
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = Math.random() * 2 + 2 + 's'; // Fast fall
          heart.style.fontSize = Math.random() * 20 + 15 + 'px';
          
          document.body.appendChild(heart);
          
          // Cleanup
          setTimeout(() => { heart.remove(); }, 4000);
        }, i * 50); // Fast interval for a "burst" effect
      }
    }
  </script>

</body>
</html>
