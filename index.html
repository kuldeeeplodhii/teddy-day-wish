<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teddy Day ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.9);
  border-radius: 25px;
  padding: 30px;
  text-align: center;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  animation: fadeIn 1.2s ease;
}

h1 {
  font-family: 'Pacifico', cursive;
  color: #ff4d6d;
  margin-bottom: 10px;
}

p {
  color: #444;
  font-size: 15px;
}

.teddy {
  width: 220px;
  margin: 20px auto;
  cursor: pointer;
  animation: float 3s ease-in-out infinite;
}

.teddy img {
  width: 100%;
  border-radius: 20px;
}

#message {
  margin-top: 15px;
  font-size: 16px;
  color: #333;
  min-height: 60px;
}

button {
  margin-top: 15px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}

button:hover {
  background: #e63b5b;
  transform: scale(1.05);
}

.heart {
  position: absolute;
  color: rgba(255, 77, 109, 0.7);
  font-size: 20px;
  animation: fall 6s linear infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes fall {
  from { transform: translateY(-10vh); }
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div class="card">
  <h1>Happy Teddy Day 🧸</h1>
  <p>Tap the teddy… he has something to say 💕</p>

  <div class="teddy" onclick="showLove()">
    <!-- Replace this image URL with your teddy image -->
    <img src="https://i.imgur.com/1Q9Z1Zm.png" alt="Teddy">
  </div>

  <div id="message"></div>

  <button onclick="toggleMusic()">🎶 Music</button>
</div>

<audio id="bgMusic" loop>
  <!-- Optional romantic music -->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
const text = "Happy Teddy Day, my love ❤️\nYou are my comfort, my smile, my favorite person.\nJust like this teddy, I’ll always be here to hug you.\n\n— Yours Forever 💕";
let index = 0;
let started = false;

function showLove() {
  if (started) return;
  started = true;

  const msg = document.getElementById("message");
  msg.innerHTML = "";

  const typing = setInterval(() => {
    msg.innerHTML += text.charAt(index).replace(/\n/g, "<br>");
    index++;
    if (index >= text.length) clearInterval(typing);
  }, 40);

  createHearts();
}

function createHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }, 300);
}

function toggleMusic() {
  const music = document.getElementById("bgMusic");
  if (music.paused) music.play();
  else music.pause();
}
</script>

</body>
</html>
